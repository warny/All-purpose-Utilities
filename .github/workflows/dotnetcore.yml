name: Utils

on:
    pull_request:
        branches: ['**']
    workflow_dispatch:

concurrency:
    group: utils-pr-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 25
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: '9.0.x'
            - name: Restore
              run: dotnet restore Utils.sln
            - name: Build
              run: dotnet build Utils.sln --configuration GitHub --no-restore
            - name: Blocking vulnerability scan
              shell: pwsh
              run: ./eng/audit-dependencies.ps1 -ArtifactsPath artifacts -SkipDeprecated -SkipOutdated
            - name: Upload build diagnostics
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: build-diagnostics
                  path: artifacts/**/*
                  if-no-files-found: warn

    test:
        needs: build
        runs-on: ubuntu-latest
        timeout-minutes: 25
        strategy:
            fail-fast: false
            matrix:
                include:
                    - suite: unit
                      project: UtilsTest/UtilsTest.Unit.csproj
                    - suite: functional
                      project: UtilsTest.Functional/UtilsTest.Functional.csproj
        name: Test (${{ matrix.suite }})
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: '9.0.x'
            - run: dotnet test ${{ matrix.project }} --configuration Release --logger "trx;LogFileName=${{ matrix.suite }}.trx" --results-directory artifacts/test-results
            - name: Upload test results
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: test-${{ matrix.suite }}
                  path: artifacts/test-results/**
                  if-no-files-found: warn

    package-validation:
        name: Package validation (${{ matrix.os }})
        needs:
            - build
            - test
        runs-on: ${{ matrix.os }}
        timeout-minutes: 55
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest]
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: '9.0.x'
            - name: Package discovery
              shell: pwsh
              run: ./eng/discover-release-projects.ps1 -Configuration Release -ArtifactsPath artifacts
            - name: Packaging and packaged acceptance
              shell: pwsh
              run: ./eng/test-packaged-product-train.ps1 -Configuration Release -ArtifactsPath artifacts
            - name: API compatibility
              shell: pwsh
              run: ./eng/validate-public-api.ps1 -Configuration Release -ArtifactsPath artifacts
            - name: Release warnings
              shell: pwsh
              run: ./eng/validate-release-warnings.ps1 -Configuration Release -ArtifactsPath artifacts
            - name: SourceLink local mappings, PDBs, and checksums
              shell: pwsh
              run: ./eng/validate-sourcelink.ps1 -ArtifactsPath artifacts -SkipRemoteRetrieval
            - name: Upload packages and diagnostics
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: package-validation-${{ matrix.os }}-${{ github.sha }}
                  path: |
                      artifacts/packages/**
                      artifacts/reports/**
                      artifacts/logs/**
                      artifacts/**/*.log
                  if-no-files-found: warn

    reproducibility:
        name: Reproducibility (Ubuntu)
        needs: package-validation
        runs-on: ubuntu-latest
        timeout-minutes: 35
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: '9.0.x'
            - name: Reproducibility
              shell: pwsh
              run: ./eng/test-package-reproducibility.ps1 -Configuration Release -ArtifactsPath artifacts
            - name: Upload reproducibility diagnostics
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: reproducibility-${{ github.sha }}
                  path: artifacts/**/*
                  if-no-files-found: warn

    validated-product-train:
        name: Assemble validated product train
        needs:
            - package-validation
            - reproducibility
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: '9.0.x'
            - name: Download Ubuntu package validation
              uses: actions/download-artifact@v4
              with:
                  name: package-validation-ubuntu-latest-${{ github.sha }}
                  path: validated-inputs/ubuntu
            - name: Download Windows package validation
              uses: actions/download-artifact@v4
              with:
                  name: package-validation-windows-latest-${{ github.sha }}
                  path: validated-inputs/windows
            - name: Download reproducibility validation
              uses: actions/download-artifact@v4
              with:
                  name: reproducibility-${{ github.sha }}
                  path: validated-inputs/reproducibility
            - name: Aggregate validated reports and generate candidate manifest
              shell: pwsh
              run: ./eng/assemble-validated-product-train.ps1 -InputsPath validated-inputs -ArtifactsPath artifacts
            - name: Upload publication-compatible validated train
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: full-product-train-${{ github.sha }}
                  path: |
                      artifacts/packages/**
                      artifacts/reports/**
                      artifacts/manifests/**
                      artifacts/logs/**
                  if-no-files-found: warn
