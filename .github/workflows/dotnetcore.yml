name: Utils pull-request validation

on:
    pull_request:
        branches: ['**']
    workflow_dispatch:

concurrency:
    group: utils-pr-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true
permissions:
    contents: read
    actions: read

env:
    DOTNET_CACHE_PATHS: |
        global.json
        NuGet.config
        Directory.Packages.props
        **/*.csproj
        **/packages.lock.json

jobs:
    changes:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        outputs:
            train: ${{ steps.scope.outputs.runProductTrain }}
            scripts: ${{ steps.scope.outputs.runReleaseScriptTests }}
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - id: scope
              shell: pwsh
              run: |
                  if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
                      ./eng/get-validation-scope.ps1 -ForceProductTrain -WriteGitHubOutput
                  } else {
                      ./eng/get-validation-scope.ps1 -BaseRef '${{ github.event.pull_request.base.sha }}' -WriteGitHubOutput
                  }
            - name: Lightweight release-script tests
              if: steps.scope.outputs.runReleaseScriptTests == 'true'
              shell: pwsh
              run: ./eng/test-release-orchestrator.ps1

    build:
        needs: changes
        if: needs.changes.outputs.train == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: '9.0.x'
                  cache: true
                  cache-dependency-path: ${{ env.DOTNET_CACHE_PATHS }}
            - run: dotnet restore Utils.sln
            - run: dotnet build Utils.sln --configuration GitHub --no-restore
            - name: Blocking product-graph vulnerability scan
              shell: pwsh
              run: ./eng/audit-dependencies.ps1 -ArtifactsPath artifacts -SkipDeprecated -SkipOutdated

    unit-tests:
        needs: changes
        if: needs.changes.outputs.train == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 25
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: '9.0.x'
                  cache: true
                  cache-dependency-path: ${{ env.DOTNET_CACHE_PATHS }}
            - run: dotnet test UtilsTest/UtilsTest.Unit.csproj --configuration Release --logger trx --results-directory artifacts/test-results

    functional-tests:
        needs: changes
        if: needs.changes.outputs.train == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 25
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: '9.0.x'
                  cache: true
                  cache-dependency-path: ${{ env.DOTNET_CACHE_PATHS }}
            - run: dotnet test UtilsTest.Functional/UtilsTest.Functional.csproj --configuration Release --logger trx --results-directory artifacts/test-results

    security-tests:
        needs: changes
        if: needs.changes.outputs.train == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 25
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: '9.0.x'
                  cache: true
                  cache-dependency-path: ${{ env.DOTNET_CACHE_PATHS }}
            - run: dotnet test UtilsTest.Security/UtilsTest.Security.csproj --configuration Release --logger trx --results-directory artifacts/test-results

    canonical-packages:
        needs: changes
        if: needs.changes.outputs.train == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: '9.0.x'
                  cache: true
                  cache-dependency-path: ${{ env.DOTNET_CACHE_PATHS }}
            - name: Discover, build, and produce the canonical set once
              shell: pwsh
              run: |
                  ./eng/discover-release-projects.ps1 -Configuration Release -ArtifactsPath artifacts
                  dotnet restore Utils.sln
                  dotnet build Utils.sln -c Release --no-restore -p:ContinuousIntegrationBuild=true -p:UseSharedCompilation=false
                  ./eng/pack-product-train.ps1 -Configuration Release -ArtifactsPath artifacts -NoBuild
                  ./eng/inspect-packages.ps1 -ArtifactsPath artifacts
                  ./eng/write-canonical-package-report.ps1 -ArtifactsPath artifacts
            - uses: actions/upload-artifact@v4
              with:
                  name: canonical-packages-${{ github.sha }}
                  path: |
                      artifacts/packages/**
                      artifacts/reports/canonical-packages.json
                      artifacts/reports/package-discovery.json
                      artifacts/reports/package-graph.json
                      artifacts/reports/package-inspection.json
                  if-no-files-found: error

    packaged-validation-ubuntu:
        needs: canonical-packages
        runs-on: ubuntu-latest
        timeout-minutes: 25
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: '9.0.x'
            - uses: actions/download-artifact@v4
              with:
                  name: canonical-packages-${{ github.sha }}
                  path: artifacts
            - name: Validate the downloaded canonical packages
              shell: pwsh
              env:
                  NUGET_PACKAGES: ${{ github.workspace }}/artifacts/packaged-acceptance/global-packages
              run: ./eng/test-packaged-product-train.ps1 -ValidationTier PullRequest -Configuration Release -ArtifactsPath artifacts -UseExistingPackages -SkipBuild
            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: package-validation-ubuntu-${{ github.sha }}
                  path: |
                      artifacts/reports/packaged-acceptance.json
                      artifacts/logs/**
                  if-no-files-found: warn

    packaged-validation-windows-light:
        needs: canonical-packages
        runs-on: windows-latest
        timeout-minutes: 25
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: '9.0.x'
            - uses: actions/download-artifact@v4
              with:
                  name: canonical-packages-${{ github.sha }}
                  path: artifacts
            - name: Restore, build, and execute representative package consumers
              shell: pwsh
              env:
                  NUGET_PACKAGES: ${{ github.workspace }}/artifacts/packaged-acceptance/global-packages
              run: ./eng/test-packaged-product-train.ps1 -ValidationTier PullRequest -Configuration Release -ArtifactsPath artifacts -UseExistingPackages -SkipBuild
            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: package-validation-windows-${{ github.sha }}
                  path: |
                      artifacts/reports/packaged-acceptance.json
                      artifacts/logs/**
                  if-no-files-found: warn

    source-gates-ubuntu:
        needs: canonical-packages
        runs-on: ubuntu-latest
        timeout-minutes: 25
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: '9.0.x'
                  cache: true
                  cache-dependency-path: ${{ env.DOTNET_CACHE_PATHS }}
            - uses: actions/download-artifact@v4
              with:
                  name: canonical-packages-${{ github.sha }}
                  path: artifacts
            - shell: pwsh
              run: |
                  dotnet restore Utils.sln
                  ./eng/validate-public-api.ps1 -Configuration Release -ArtifactsPath artifacts
                  ./eng/validate-release-warnings.ps1 -Configuration Release -ArtifactsPath artifacts -NoRestore
                  ./eng/validate-sourcelink.ps1 -ArtifactsPath artifacts -SkipRemoteRetrieval
            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: source-gates-${{ github.sha }}
                  path: |
                      artifacts/reports/public-api-comparison.json
                      artifacts/reports/warnings.json
                      artifacts/reports/sourcelink.json
                      artifacts/logs/**
                  if-no-files-found: warn

    required:
        if: always()
        needs: [changes, build, unit-tests, functional-tests, security-tests, canonical-packages, packaged-validation-ubuntu, packaged-validation-windows-light, source-gates-ubuntu]
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@v4
            - name: Write measured phase summary
              if: always()
              continue-on-error: true
              shell: pwsh
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  Invoke-WebRequest -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' } -Uri '${{ github.api_url }}/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs?per_page=100' -OutFile jobs.json
                  ./eng/convert-actions-job-timings.ps1 -JobsJson jobs.json -ArtifactsPath artifacts
            - name: Write non-publishable PR validation summary
              shell: pwsh
              run: |
                  New-Item artifacts/reports -ItemType Directory -Force | Out-Null
                  [ordered]@{
                      commit = '${{ github.sha }}'
                      validationTier = 'pull-request'
                      publishable = $false
                      buildPassed = '${{ needs.build.result }}' -eq 'success'
                      unitTestsPassed = '${{ needs.unit-tests.result }}' -eq 'success'
                      functionalTestsPassed = '${{ needs.functional-tests.result }}' -eq 'success'
                      securityTestsPassed = '${{ needs.security-tests.result }}' -eq 'success'
                      canonicalPackagesProduced = '${{ needs.canonical-packages.result }}' -eq 'success'
                      ubuntuPackageValidationPassed = '${{ needs.packaged-validation-ubuntu.result }}' -eq 'success'
                      windowsPackageValidationPassed = '${{ needs.packaged-validation-windows-light.result }}' -eq 'success'
                      sourceGatesPassed = '${{ needs.source-gates-ubuntu.result }}' -eq 'success'
                  } | ConvertTo-Json | Set-Content artifacts/reports/pull-request-validation.json
            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: pull-request-validation-${{ github.sha }}
                  path: |
                      artifacts/reports/pull-request-validation.json
                      artifacts/reports/workflow-timings.json
                  if-no-files-found: warn
            - name: Enforce required results (documentation-only is valid)
              shell: bash
              run: |
                  test '${{ needs.changes.result }}' = success
                  if test '${{ needs.changes.outputs.train }}' = true; then
                      test '${{ needs.build.result }}' = success
                      test '${{ needs.unit-tests.result }}' = success
                      test '${{ needs.functional-tests.result }}' = success
                      test '${{ needs.security-tests.result }}' = success
                      test '${{ needs.canonical-packages.result }}' = success
                      test '${{ needs.packaged-validation-ubuntu.result }}' = success
                      test '${{ needs.packaged-validation-windows-light.result }}' = success
                      test '${{ needs.source-gates-ubuntu.result }}' = success
                  fi
