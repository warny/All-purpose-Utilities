name: Utils

on:
    pull_request:
        branches:
            - '**'

permissions:
    contents: read

jobs:
    build:

        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4
            - name: Setup .NET 9.0.x
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: '9.0.x'
            - name: Build
              run: dotnet build --configuration GitHub
            - name: Scan vulnerable packages
              run: dotnet list Utils.sln package --vulnerable --include-transitive

    test:

        needs: build
        runs-on: ubuntu-latest
        strategy:
            matrix:
                include:
                    - test-suite: unit
                      project: UtilsTest/UtilsTest.Unit.csproj
                    - test-suite: functional
                      project: UtilsTest.Functional/UtilsTest.Functional.csproj
        name: Test (${{ matrix.test-suite }})

        steps:
            - uses: actions/checkout@v4
            - name: Setup .NET 9.0.x
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: '9.0.x'
            - name: Test (${{ matrix.test-suite }})
              run: dotnet test ${{ matrix.project }} --verbosity normal

    release-quality-gates:
        name: Packaged full product-train acceptance (${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest]
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  ref: ${{ github.event.pull_request.head.sha }}
            - name: Setup .NET 9.0.x
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: '9.0.x'
            - name: Run repository-wide release quality gates
              shell: pwsh
              run: ./eng/run-release-quality-gates.ps1 -Configuration Release
            - name: Upload validated full train and reports
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: full-product-train-${{ matrix.os }}-${{ github.sha }}
                  path: |
                      artifacts/packages/*.nupkg
                      artifacts/packages/*.snupkg
                      artifacts/reports/**
                      artifacts/manifests/**
                      artifacts/**/*.log
                  if-no-files-found: warn
