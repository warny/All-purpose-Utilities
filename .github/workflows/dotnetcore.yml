name: Utils pull-request validation

on:
    pull_request:
        branches: ['**']
    workflow_dispatch:

concurrency:
    group: utils-pr-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true
permissions:
    contents: read
    actions: read

jobs:
    changes:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        outputs:
            train: ${{ steps.scope.outputs.runProductTrain }}
            scripts: ${{ steps.scope.outputs.runReleaseScriptTests }}
        steps:
            - uses: actions/checkout@v4
              with: { fetch-depth: 0 }
            - id: scope
              shell: pwsh
              run: ./eng/get-validation-scope.ps1 -BaseRef '${{ github.event.pull_request.base.sha || github.event.before }}' -WriteGitHubOutput
            - name: Lightweight release-script tests
              if: steps.scope.outputs.runReleaseScriptTests == 'true'
              shell: pwsh
              run: ./eng/test-validation-scope.ps1

    build:
        needs: changes
        if: needs.changes.outputs.train == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: '9.0.x'
                  cache: true
                  cache-dependency-path: '**/*.csproj'
            - run: dotnet restore Utils.sln
            - run: dotnet build Utils.sln --configuration GitHub --no-restore
            - name: Blocking product-graph vulnerability scan
              shell: pwsh
              run: ./eng/audit-dependencies.ps1 -ArtifactsPath artifacts -SkipDeprecated -SkipOutdated

    tests:
        needs: [changes, build]
        if: needs.changes.outputs.train == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 25
        strategy:
            fail-fast: false
            matrix:
                include:
                    - { suite: Unit, project: UtilsTest/UtilsTest.Unit.csproj }
                    - { suite: Functional, project: UtilsTest.Functional/UtilsTest.Functional.csproj }
        name: ${{ matrix.suite }} tests
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: '9.0.x'
                  cache: true
                  cache-dependency-path: '**/*.csproj'
            - run: dotnet test ${{ matrix.project }} --configuration Release --logger trx --results-directory artifacts/test-results

    canonical-packages:
        needs: [changes, build]
        if: needs.changes.outputs.train == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v4
              with: { fetch-depth: 0 }
            - uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: '9.0.x'
                  cache: true
                  cache-dependency-path: '**/*.csproj'
            - name: Discover, build, and produce the canonical set once
              shell: pwsh
              run: |
                  ./eng/discover-release-projects.ps1 -Configuration Release -ArtifactsPath artifacts
                  dotnet restore Utils.sln
                  dotnet build Utils.sln -c Release --no-restore -p:ContinuousIntegrationBuild=true -p:UseSharedCompilation=false
                  ./eng/pack-product-train.ps1 -Configuration Release -ArtifactsPath artifacts -NoBuild
                  ./eng/inspect-packages.ps1 -ArtifactsPath artifacts
                  ./eng/write-canonical-package-report.ps1 -ArtifactsPath artifacts
            - uses: actions/upload-artifact@v4
              with:
                  name: canonical-packages-${{ github.sha }}
                  path: artifacts

    packaged-validation:
        needs: [canonical-packages, tests]
        strategy:
            fail-fast: false
            matrix: { os: [ubuntu-latest, windows-latest] }
        runs-on: ${{ matrix.os }}
        timeout-minutes: 35
        name: Package validation (${{ matrix.os }})
        steps:
            - uses: actions/checkout@v4
              with: { fetch-depth: 0 }
            - uses: actions/setup-dotnet@v4
              with: { dotnet-version: '9.0.x' }
            - uses: actions/download-artifact@v4
              with: { name: 'canonical-packages-${{ github.sha }}', path: artifacts }
            - name: Validate the downloaded canonical packages
              shell: pwsh
              env:
                  NUGET_PACKAGES: ${{ github.workspace }}/artifacts/packaged-acceptance/global-packages
              run: ./eng/test-packaged-product-train.ps1 -ValidationTier PullRequest -Configuration Release -ArtifactsPath artifacts -UseExistingPackages -SkipBuild
            - uses: actions/upload-artifact@v4
              if: always()
              with: { name: 'package-validation-${{ matrix.os }}-${{ github.sha }}', path: artifacts/reports }

    source-gates:
        needs: canonical-packages
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v4
              with: { fetch-depth: 0 }
            - uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: '9.0.x'
                  cache: true
                  cache-dependency-path: '**/*.csproj'
            - uses: actions/download-artifact@v4
              with: { name: 'canonical-packages-${{ github.sha }}', path: artifacts }
            - shell: pwsh
              run: |
                  dotnet restore Utils.sln
                  ./eng/validate-public-api.ps1 -Configuration Release -ArtifactsPath artifacts
                  ./eng/validate-release-warnings.ps1 -Configuration Release -ArtifactsPath artifacts -NoRestore
                  ./eng/validate-sourcelink.ps1 -ArtifactsPath artifacts -SkipRemoteRetrieval
            - uses: actions/upload-artifact@v4
              with: { name: 'source-gates-${{ github.sha }}', path: artifacts/reports }

    assemble-pr-candidate:
        needs: [canonical-packages, packaged-validation, source-gates]
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v4
              with: { fetch-depth: 0 }
            - uses: actions/setup-dotnet@v4
              with: { dotnet-version: '9.0.x' }
            - uses: actions/download-artifact@v4
              with: { name: 'canonical-packages-${{ github.sha }}', path: validated-inputs/canonical }
            - uses: actions/download-artifact@v4
              with: { name: 'package-validation-ubuntu-latest-${{ github.sha }}', path: validated-inputs/ubuntu }
            - uses: actions/download-artifact@v4
              with: { name: 'package-validation-windows-latest-${{ github.sha }}', path: validated-inputs/windows }
            - uses: actions/download-artifact@v4
              with: { name: 'source-gates-${{ github.sha }}', path: validated-inputs/ubuntu/reports }
            - shell: pwsh
              run: ./eng/assemble-validated-product-train.ps1 -ValidationTier PullRequest -InputsPath validated-inputs -ArtifactsPath artifacts
            - uses: actions/upload-artifact@v4
              with: { name: 'pull-request-product-train-${{ github.sha }}', path: artifacts }

    required:
        if: always()
        needs: [changes, build, tests, canonical-packages, packaged-validation, source-gates, assemble-pr-candidate]
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@v4
            - name: Write measured phase summary
              if: always()
              shell: pwsh
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  Invoke-WebRequest -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' } -Uri '${{ github.api_url }}/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs?per_page=100' -OutFile jobs.json
                  ./eng/convert-actions-job-timings.ps1 -JobsJson jobs.json -ArtifactsPath artifacts
            - uses: actions/upload-artifact@v4
              if: always()
              with: { name: 'workflow-timings-${{ github.sha }}', path: artifacts/reports/workflow-timings.json }
            - name: Enforce required results (documentation-only is valid)
              shell: bash
              run: |
                  test '${{ needs.changes.result }}' = success
                  if test '${{ needs.changes.outputs.train }}' = true; then test '${{ needs.assemble-pr-candidate.result }}' = success; fi
